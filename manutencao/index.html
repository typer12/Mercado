<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  if (!params.has("v")) {
    window.location.replace("verificacao.html" + window.location.search);
  }
})();
</script>
<script>
if (window.location.pathname.endsWith('/index.html') || window.location.pathname.endsWith('index.html')) {
  window.location.replace('verificacao.html' + window.location.search);
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Em Manutenção</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b,#334155);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.container{text-align:center;background:rgba(255,255,255,.08);padding:40px;border-radius:24px;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(92%,650px)}
h1{font-size:clamp(2rem,5vw,3.5rem);margin-bottom:16px}
p{font-size:1.15rem;opacity:.92;line-height:1.6}
.highlight{color:#38bdf8;font-weight:700}
.loader-wrap{margin:35px 0 10px}
.bar{height:14px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
.progress{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#38bdf8,#a855f7);animation:load 8s linear infinite;border-radius:999px}
@keyframes load{0%{width:0}100%{width:100%}}
.dots span{display:inline-block;font-size:28px;animation:bounce 1.2s infinite;margin:0 4px}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-10px);opacity:1}}
.small{margin-top:10px;font-size:.95rem;opacity:.75}
</style>
</head>
<body>
<div class="container">
<h1>🚧 Site em Manutenção</h1>
<p>Estamos realizando melhorias para você ter uma experiência melhor.</p>
<p class="highlight">Aguarde... voltaremos antes de 00:00</p>
<div class="loader-wrap">
<div class="bar"><div class="progress"></div></div>
<div class="dots"><span>•</span><span>•</span><span>•</span></div>
</div>
<div class="small">Obrigado pela compreensão 💙</div>
</div>
</body>
</html>
